{% extends "admin/layout.html" %}
{% block title %}Admin Setup{% endblock %}
{% block page_title %}First Time Setup{% endblock %}
{% block content %}
<div style="max-width:520px;margin:40px auto">
  <div style="text-align:center;margin-bottom:28px">
    <h1 style="font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800">Create Admin Account</h1>
    <p style="color:var(--muted);font-size:0.88rem;margin-top:6px">Set up your store administrator account</p>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="name" required></div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" required></div>
        </div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" required></div>
        <div style="margin:20px 0;border-top:1px solid rgba(255,255,255,0.07);padding-top:20px">
          <p style="font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px">Payment Details</p>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Bank Name</label><input type="text" name="bank_name" placeholder="e.g. First Bank" required></div>
            <div class="form-group"><label class="form-label">Account Number</label><input type="text" name="account_number" placeholder="0123456789" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Account Name</label><input type="text" name="account_name" required></div>
            <div class="form-group"><label class="form-label">Contact Phone</label><input type="tel" name="phone" placeholder="+234..." required></div>
          </div>
        </div>
        <button type="submit" class="btn btn-fire btn-lg btn-full">Create Admin Account →</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
