<!-- admin/login.html -->
{% extends "admin/layout.html" %}
{% block title %}Admin Login{% endblock %}
{% block page_title %}Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;background:var(--g-fire);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite">
      Admin Panel
    </div>
    <p style="color:var(--muted);font-size:0.88rem;margin-top:6px">Sign in to manage your store</p>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-group"><label class="form-label">Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" required></div>
        <button type="submit" class="btn btn-fire btn-lg btn-full mt-3">Sign In →</button>
      </form>
      <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--muted)">
        First time? <a href="{{ url_for('admin.setup') }}" style="color:var(--coral);font-weight:700;text-decoration:none">Create admin account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
