{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page" style="margin:-32px -36px;min-height:calc(100vh - 100px)">
  <div class="auth-left">
    <h1 class="auth-heading">Welcome<br>Back.</h1>
    <div class="auth-divider"></div>
    <p class="auth-sub">Sign in to track your orders, save your wishlist, and enjoy a seamless shopping experience.</p>
  </div>
  <div class="auth-right">
    <div class="auth-box">
      <div class="auth-box-title">Sign In</div>
      <div class="auth-box-sub">Enter your credentials to continue</div>
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-purple btn-lg btn-full mt-3">Sign In →</button>
      </form>
      <p style="text-align:center;font-size:0.83rem;color:var(--muted);margin-top:18px">
        No account?
        <a href="{{ url_for('base.register') }}" style="color:var(--purple);font-weight:700;text-decoration:none">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
